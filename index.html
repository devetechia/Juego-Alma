<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Alma Aventura Familiar - Juego infantil para tablet">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alma">
    <title>Alma - Aventura Familiar</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* PWA install prompt */
        #install-prompt {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #e94560;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
            max-width: 92vw;
            text-align: center;
        }

        #install-prompt button {
            background: white;
            color: #e94560;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            margin-left: 12px;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            #game-container {
                max-width: 100%;
                max-height: 100%;
            }
        }

        /* Loading screen while JS loads */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: 'Press Start 2P', cursive;
            color: #e94560;
        }

        #loading-screen.hidden {
            display: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Aviso de rotación (solo en vertical) */
        #rotate-hint {
            display: none;
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            color: #ffffff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            z-index: 9000;
            text-align: center;
            font-size: 16px;
            padding: 24px;
        }

        #rotate-hint .rotate-icon {
            font-size: 56px;
            color: #e94560;
        }

        #rotate-hint .rotate-sub {
            color: #9aa0b5;
            font-size: 12px;
        }

        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-hint { display: flex; }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div>CARGANDO ALMA...</div>
    </div>

    <div id="game-container"></div>

    <div id="install-prompt">
        Instalar en pantalla de inicio
        <button id="install-btn">Instalar</button>
    </div>

    <!-- Aviso para girar el dispositivo en vertical -->
    <div id="rotate-hint">
        <div class="rotate-icon">&#128241;&#8635;</div>
        <div>Gira el dispositivo</div>
        <div class="rotate-sub">El juego se juega en horizontal</div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <script>
        // Hide loading screen when game initializes
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 500);
        });

        // PWA install prompt: se muestra arriba y se oculta solo (no debe tapar el juego)
        let deferredPrompt;
        let installTimer;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const el = document.getElementById('install-prompt');
            el.style.display = 'block';
            clearTimeout(installTimer);
            installTimer = setTimeout(() => { el.style.display = 'none'; }, 9000);
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-prompt').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Service worker registration
        if ('serviceWorker' in navigator) {
            window.addEventEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        // Prevent pull-to-refresh on mobile
        document.body.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        // Prevent double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
</html>
